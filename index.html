<style>
:root{--bg:#E7EBEF;--surface:#fff;--ink:#0E1B24;--muted:#4A5661;--line:#C9D1D9;--brand:#0F4C68;--brand-ink:#fff;--soft:#E4EEF3;
--ok:#2E8B57;--ok-bg:#E2F3EA;--soon:#B87C00;--soon-bg:#FFF1CC;--exp:#C7361F;--exp-bg:#FBE9E5;
--sh:0 1px 2px rgba(16,24,40,.07),0 4px 12px rgba(16,24,40,.09);--r:18px;--bar:68px;
--cnt:#1F6FA8;--cnt-bg:#E3EEF8;--s-red:#C7361F;--s-blue:#1F6FA8;--s-white:#8996A1;--s-black:#14181C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Lato,sans-serif}
body{padding-bottom:calc(var(--bar) + 24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:14px;margin:0;flex:1}
header small{display:block;font-weight:400;opacity:.8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1{min-width:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid #fff}
.iconbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;height:38px;min-width:36px;font-size:16px;padding:0 7px;position:relative;display:inline-flex;align-items:center;justify-content:center}
header{gap:7px!important}
#bellc{position:absolute;right:-3px;top:-4px;min-width:17px;height:17px;border-radius:9px;background:#E5483B;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--brand)}
#bellc[hidden]{display:none}
main{padding:14px 16px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:14px}
.card h2{font-size:14px;font-weight:600;margin:0 0 10px}
b,strong{font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:10px 14px}
.tile.wide{grid-column:1/-1;background:var(--brand);color:#fff}
.tile .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tile.wide .l{color:#cfe3ec}
.tile .v{font-size:16px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bub{background:var(--surface);border:2px solid transparent;border-radius:16px;box-shadow:var(--sh);padding:10px 12px;text-align:left;font:inherit;color:inherit;min-height:84px;position:relative;display:block;width:100%}
.bub .n{font-weight:600;display:block;line-height:1.2}
.bub .p{font-size:14px;font-weight:600;color:var(--brand)}
.bub .s{font-size:11px;color:var(--muted)}
.bub .pill{position:absolute;right:8px;top:8px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{background:var(--surface);border:0;border-left:5px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:9px 10px 9px 12px;text-align:left;font:inherit;color:inherit;display:block;width:100%;position:relative}
.cc.done{border-left-color:var(--cnt);background:linear-gradient(90deg,var(--cnt-bg),var(--surface) 70%)}.cc.low{border-left-color:var(--soon)}.cc.out{border-left-color:var(--exp)}
.cc .cn{font-size:12px;font-weight:700;line-height:1.2;padding-right:2px}
.cc .cv{font-size:15px;font-weight:500;line-height:1.15;color:var(--ink);margin-top:2px}.cc.out .cv{color:var(--exp)}
.cc .cs{font-size:11px;color:var(--muted);margin-top:1px}
.cc .ck{position:absolute;right:10px;top:8px;font-size:12px;font-weight:700;color:var(--cnt)}
.cprog{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:8px}.cprog>div{height:100%;background:var(--cnt);border-radius:6px}
.pill{display:inline-block;font-size:12px;font-weight:600;color:var(--ok)}
.pill.low{color:var(--soon)}.pill.out{color:var(--exp)}
button.btn{border:0;border-radius:12px;height:42px;padding:0 18px;font:inherit;font-weight:600;background:var(--brand);color:var(--brand-ink)}
button.btn.sec{background:var(--soft);color:var(--brand)}button.btn.red{background:var(--exp);color:#fff}button.btn.amber{background:var(--soon);color:#fff}button.btn.green{background:var(--ok)}
button.btn.sm{height:34px;padding:0 12px;font-size:12px}
button.btn.block{width:100%}
button:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.grow{flex:1}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:23px;font-weight:600;line-height:1}
.stepper .stepin{width:74px;height:46px;text-align:center;font-size:16px;font-weight:600;padding:0 4px}
.selbtn{display:flex;align-items:center;justify-content:space-between;text-align:left;background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important;font-weight:600!important}
input,select{font:inherit;font-size:14px;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;color:var(--ink);width:100%}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 4px}
.f{margin-bottom:10px}
.list>div{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list>div[data-act]{cursor:pointer}
.list>div:first-child{border-top:0}
.muted{color:var(--muted);font-size:11px}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 3px}th:first-child,td:first-child{text-align:left}
td{padding:7px 3px;border-top:1px solid var(--line);text-align:right;vertical-align:middle}
tr.tot td{font-weight:600}
nav{z-index:30!important;position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:6}
nav button{border:0;background:none;font:inherit;font-size:10px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:18px}
nav button.on{color:var(--brand);background:var(--soft)}
.sum>div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.sum>div:first-child,.sum>h2+div{border-top:0}
.sum .t{font-weight:600;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(var(--navoff,var(--bar)) + 12px);transform:translateX(-50%);background:#0E1B24;color:#fff;padding:7px 8px 9px 14px;border-radius:999px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:94%;display:flex;gap:10px;align-items:center;font-size:12px;overflow:hidden}
#toast .tline{position:absolute;left:0;bottom:0;height:3px;background:#6FC3E8;width:100%;transform-origin:left;animation:tl 3s linear forwards}
@keyframes tl{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#toast.show{opacity:1;pointer-events:auto}
#toast button{border:0;background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:12px;border-radius:999px;height:28px;padding:0 12px}
.modal{position:fixed;inset:0;background:rgba(14,27,36,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--bg);width:100%;max-width:640px;max-height:calc(100vh - var(--bar) - 24px - env(safe-area-inset-bottom));overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px 20px;margin-bottom:calc(var(--bar) + env(safe-area-inset-bottom))}
.modal.mid{align-items:center;padding:16px;z-index:40}.modal.mid>div{border-radius:18px;max-height:88vh;margin-bottom:0}
.modal h2{margin:0 0 10px;font-size:14px;font-weight:600}
.grab{display:block;width:38px;height:4px;border-radius:2px;background:#B5C0C8;margin:-4px auto 10px}
.modal>div{transition:transform .18s ease}.modal>div.pulling{transition:none}
.seg{display:grid;gap:8px}
.seg button{border:2px solid var(--line);border-radius:10px;min-height:44px;background:#fff;font:inherit;font-weight:600;padding:0 6px}
.seg button.on{border-color:var(--brand);background:var(--soft)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chips button{flex:none;border:2px solid var(--line);border-radius:18px;height:34px;padding:0 12px;background:#fff;font:inherit;font-size:12px;font-weight:600}
.chips button.on{border-color:var(--brand);background:var(--soft)}
.ros{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 10px;font-size:13px;align-items:center}
.sw{display:inline-block;padding:1px 9px;border-radius:8px;color:#fff;font-size:11px;font-weight:700}
.sw.Red{background:var(--s-red)}.sw.Blue{background:var(--s-blue)}.sw.White{background:#fff;color:#14181C;border:1px solid var(--s-white)}.sw.Black{background:var(--s-black)}
.sw.None{background:var(--line);color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:600;margin-left:8px;color:var(--cnt)}
.tag.neg{color:var(--exp)}.tag.pos{color:var(--ok)}.tag.cr{color:var(--soon)}
.sec-h{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);padding:10px 0 2px;border:0!important}
.sigimg{max-width:100%;max-height:90px;display:block;margin:6px 0}
.sigcard{border:2px dashed var(--line);border-radius:14px;padding:10px;background:#fff}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:8px}
.cancelbar{background:var(--exp-bg);color:var(--exp);font-weight:700;border-radius:12px;padding:8px 12px;margin-bottom:10px}
#pad{position:fixed;inset:0;background:#fff;z-index:80;overflow:hidden;touch-action:none}
#pad .prot{position:absolute;left:0;top:0;transform-origin:top left}
#pad canvas{position:absolute;left:0;top:0;touch-action:none}
#pad .plb{position:absolute;left:36px;top:30px;font-size:13px;font-weight:700;color:#3E4B57;max-width:50%}
#pad .pbts{position:absolute;right:20px;top:16px;display:flex;gap:12px}
#pad .pbts button{width:110px;height:46px;border-radius:14px;border:1.5px solid var(--line);color:var(--brand);font:inherit;font-weight:800;font-size:15px;background:#fff}
#pad .pbts button.d{background:var(--brand);color:#fff;border-color:var(--brand)}
#pad .phint{position:absolute;left:0;right:0;top:50%;margin-top:-10px;text-align:center;color:#9AA7B3;font-size:18px;font-weight:600;pointer-events:none}
#pad .pline{position:absolute;left:36px;right:36px;bottom:50px;border-top:2px solid var(--line);pointer-events:none}
.pl>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.pl>div:first-child,.pl>h2+div{border-top:0}.pl .big{font-size:14px;font-weight:600}.pl .sub{padding-left:14px;color:var(--muted);font-size:13px}
.bar{height:10px;border-radius:5px;background:var(--ok)}.bar.neg{background:var(--exp)}.good{color:var(--ok)}.bad{color:var(--exp)}
.modal.top{align-items:flex-start}.modal.top>div{margin-bottom:0;border-radius:0 0 18px 18px;max-height:calc(var(--vvh,100vh) - var(--navoff,68px));padding-top:calc(10px + env(safe-area-inset-top))}
html:has(#mbg.top),body:has(#mbg.top){overflow:hidden;overscroll-behavior:none}.modal.top>div,.modal.top .list{overscroll-behavior:contain}   /* a search pop-up never lets the page behind it scroll */
.modal.top>div:has(>.sq+.list){display:flex;flex-direction:column;overflow:hidden}.modal.top>div:has(>.sq+.list)>.list{flex:1;min-height:0;overflow:auto}   /* search pop-ups: title and search stay put, only the list scrolls, Cancel stays at the bottom */
.sq{position:sticky;top:-10px;z-index:3;background:var(--bg);padding:6px 0 8px;margin:-6px 0 0}
.stick{position:sticky;top:var(--hh,60px);z-index:4;background:var(--bg);padding:6px 0 10px;margin:-6px 0 0}
input:disabled{background:#EEF0F2;color:#7C8791}
@media print{body>*:not(#modal){display:none!important}.modal{position:static;background:none}.modal>div{max-height:none;overflow:visible}.noprint{display:none!important}}
#updbar{position:fixed;left:12px;right:12px;bottom:calc(var(--bar) + 10px + env(safe-area-inset-bottom));z-index:28;background:#0E1B24;color:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#updbar span{flex:1;font-weight:700;font-size:13px}
[hidden]{display:none!important}
.mn{color:var(--exp)!important}
.tile.wide:not(.pf1) .mn{color:#FF9E92!important}
.tile.wide.pf1{background:#fff;color:var(--ink);border-left:6px solid var(--ok)}.tile.wide.pf1.neg{border-left-color:var(--exp)}.pf1 .l{color:var(--muted)!important}.pf1 .v{color:var(--ok)}.pf1.neg .v{color:var(--exp)}
.tbtn{border:0;text-align:left;font:inherit;color:inherit;width:100%;cursor:pointer;border-left:4px solid var(--cnt)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ig{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:10px;background:#fff;height:42px;padding:0 10px}
.ig input{border:0!important;height:40px;padding:0!important;background:none!important;flex:1;min-width:0;outline:0}
.ig i{font-style:normal;color:var(--muted);font-size:12px;white-space:nowrap}
.ig:has(input:disabled){background:#EEF0F2}
</style>

  if (BOOT) return; BOOT = true;
  var b = writeBatch(DB);
  b.set(ref('shop/state'), { controlEmail: EMAIL, controlName: 'President', pending: '', shift: newShift(currentShift(), 0), v: 2 });
  seedPeople().forEach(function (p) { b.set(ref('people/' + p.id), { watch: p.watch, no: p.no, rank: p.rank, name: p.name }); });
  commit(b);
}
async function afterSignIn(user) {
  EMAIL = (user.email || '').toLowerCase(); STAGE = 'loading'; render();
  try {
    var m = await getDoc(ref('members/' + EMAIL));
    if (m.exists()) M = m.data();
    else if (EMAIL === PRESIDENT) { M = { email: EMAIL, role: 'president', personId: '', addedBy: EMAIL, at: Date.now() }; await setDoc(ref('members/' + EMAIL), M); }
    else { STAGE = 'noaccess'; render(); return; }
  } catch (e) { console.error(e); STAGE = 'noaccess'; render(); return; }
  startListeners();
}
if (CONFIGURED) {
  (async function () {
    if (isSignInWithEmailLink(AUTH, location.href)) {
      var em = ''; try { em = localStorage.getItem('sw.email') || ''; } catch (x) {}
      if (!em) em = (prompt('Please type the email you used to sign in:') || '').trim().toLowerCase();
      try { await signInWithEmailLink(AUTH, em, location.href); try { localStorage.removeItem('sw.email'); } catch (x) {} } catch (e) { toast('That sign-in link did not work. Send a new one.'); }
      history.replaceState(null, '', location.origin + location.pathname + (EMU ? '?emu' : ''));
    }
    try { SENT = localStorage.getItem('sw.email') || ''; } catch (x) {}
    onAuthStateChanged(AUTH, function (u) {
      stopListeners(); M = null; WHO_DONE = false; MIGR = false;
      if (!u) { EMAIL = ''; STAGE = 'login'; render(); return; }
      afterSignIn(u);
    });
  })();
}
/* ---------- phone back button: close the top pop-up, then go back to Sell, then ask before leaving ---------- */
var HD = 1, SKIP = 0, LASTBACK = 0;
function layers() { return 1 + ($('#padhost').children.length ? 1 : 0) + $('#modal').children.length + (tab !== 'sell' ? 1 : 0); }
function hsync() {   /* keep one history entry per open layer, so the back button always has something to close */
  var n = layers();
  while (HD < n) { history.pushState({ sw: 1 }, ''); HD++; }
  while (HD > n) { HD--; SKIP++; history.back(); }
}
window.addEventListener('popstate', function () {
  if (SKIP > 0) { SKIP--; return; }
  HD = Math.max(0, HD - 1);
  var pad = $('#padhost'), kids = $('#modal').children, top = kids.length ? kids[kids.length - 1] : null;
  if (pad.children.length) { var c = pad.querySelector('[data-p=cancel]'); if (c) c.click(); }
  else if (top && top.id === 'cf') { CONF = null; top.remove(); }
  else if (top && top.id === 'instp') { var l = top.querySelector('[data-act=instlater]'); if (l) l.click(); }
  else if (top) closeModal();
  else if (tab !== 'sell') { tab = 'sell'; render(); window.scrollTo(0, 0); }
  else if (Date.now() - LASTBACK < 2500) { HD = 0; history.back(); return; }   /* second back press: leave the app */
  else { LASTBACK = Date.now(); toast('Press back again to leave the app'); }
  hsync();
});
history.replaceState({ sw: 0 }, ''); history.pushState({ sw: 1 }, '');
if (window.MutationObserver) { var mo = new MutationObserver(hsync); mo.observe($('#modal'), { childList: true }); mo.observe($('#padhost'), { childList: true }); }

/* ---------- updates: the app tells you when a newer version is on the server; it only updates when you tap Update ---------- */
var UPD = { ver: '', later: 0 };
function vnum(v) { var a = String(v).split('.'); return (+a[0] || 0) * 1000 + (+a[1] || 0); }
function showUpd() { $('#updbar span').textContent = '🔔 New version ' + UPD.ver + ' is ready'; $('#updbar').hidden = false; }
async function checkUpdate(manual) {
  try {
    var r = await fetch('index.html?_=' + Date.now(), { cache: 'no-store' }), t = await r.text(), m = t.match(/APP_VERSION = '([0-9.]+)'/);
    if (m && vnum(m[1]) > vnum(APP_VERSION)) { UPD.ver = m[1]; if (manual || Date.now() > UPD.later) showUpd(); if (manual) { toast('New version ' + m[1] + ' is ready'); } return true; }
    $('#updbar').hidden = true; if (manual) toast('You have the latest version (' + APP_VERSION + ')'); return false;
  } catch (e) { if (manual) toast('Could not check. Are you online?'); return false; }
}
function doUpdate() {
  try { localStorage.setItem('sw.updFrom', APP_VERSION); } catch (x) {}
  var go = function () { location.reload(); };
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(function (r) { return r ? r.update() : null; }).catch(function () {}).then(go); else go();
}
function updNow() {
  var dirty = $('#modal').children.length || (BUY && (BUY.sup || BUY.total || BUY.receipt || BUY.note));
  if (dirty) askConfirm('Update now?', 'The app reloads with the new version. Anything saved stays safe; a half-filled form is cleared.', 'Yes, update', doUpdate); else doUpdate();
}
setInterval(function () { if (document.visibilityState === 'visible' && STAGE === 'ready') checkUpdate(false); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && STAGE === 'ready') checkUpdate(false); });
setTimeout(function () { if (STAGE === 'ready') checkUpdate(false); }, 15000);
try { var uf = localStorage.getItem('sw.updFrom'); if (uf) { localStorage.removeItem('sw.updFrom'); if (uf !== APP_VERSION) setTimeout(function () { toast('Updated to version ' + APP_VERSION); }, 1500); } } catch (x) {}

function vv() {   /* the part of the screen not covered by the keyboard: search pop-ups use it so results stay visible */
  var v = window.visualViewport, r = document.documentElement.style;
  var kb = v && window.innerHeight - v.height > 120;   /* keyboard open: the tab bar is hidden behind it, so use the whole visible height */
  r.setProperty('--vvh', (v ? v.height : window.innerHeight) + 'px'); r.setProperty('--navoff', kb ? '0px' : 'calc(var(--bar) + env(safe-area-inset-bottom))'); var h = document.querySelector('header'); if (h) r.setProperty('--hh', h.offsetHeight + 'px');
}
if (window.visualViewport) { window.visualViewport.addEventListener('resize', vv); window.visualViewport.addEventListener('scroll', vv); }
window.addEventListener('resize', vv); vv();
window.addEventListener('online', render); window.addEventListener('offline', render);
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () {});
updInstall();
render();
</script>
