<style>
:root{--bg:#E7EBEF;--surface:#fff;--ink:#0E1B24;--muted:#4A5661;--line:#C9D1D9;--brand:#0F4C68;--brand-ink:#fff;--soft:#E4EEF3;
--ok:#2E8B57;--ok-bg:#E2F3EA;--soon:#B87C00;--soon-bg:#FFF1CC;--exp:#C7361F;--exp-bg:#FBE9E5;
--sh:0 1px 2px rgba(16,24,40,.07),0 4px 12px rgba(16,24,40,.09);--r:18px;--bar:68px;

--field:#fff;--link:var(--brand);--dis:#EEF0F2;--toast:#0E1B24;--pop:var(--bg);--ov:rgba(14,27,36,.55);--secb:#7C9DB0;--ib:#C9D1D9;color-scheme:light}
/* dark: chosen in Settings > Appearance, or followed from the phone when it is on Automatic */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10181F;--surface:#212E3A;--ink:#E8EEF2;--muted:#9FAEBA;--line:#2E3B46;--soft:#243542;--ok:#4FC48C;--ok-bg:#163428;--soon:#E2AB2B;--soon-bg:#3B3011;--exp:#F2705C;--exp-bg:#3C1E19;--sh:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.35);--cnt:#5DAEE6;--cnt-bg:#17324A;--s-red:#D9533D;--s-blue:#3C8BCB;--s-white:#9FAEBA;--s-black:#05080A;--field:#222E38;--link:#86C7EA;--dis:#26323C;--toast:#2B3A47;--pop:#18232D;--ov:rgba(0,0,0,.72);--secb:#58798D;--ib:#4A5E70;color-scheme:dark}
:root:not([data-theme=light]) .sigimg{filter:invert(1)}}
:root[data-theme=dark]{--bg:#10181F;--surface:#212E3A;--ink:#E8EEF2;--muted:#9FAEBA;--line:#2E3B46;--soft:#243542;--ok:#4FC48C;--ok-bg:#163428;--soon:#E2AB2B;--soon-bg:#3B3011;--exp:#F2705C;--exp-bg:#3C1E19;--sh:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.35);--cnt:#5DAEE6;--cnt-bg:#17324A;--s-red:#D9533D;--s-blue:#3C8BCB;--s-white:#9FAEBA;--s-black:#05080A;--field:#222E38;--link:#86C7EA;--dis:#26323C;--toast:#2B3A47;--pop:#18232D;--ov:rgba(0,0,0,.72);--secb:#58798D;--ib:#4A5E70;color-scheme:dark}
:root[data-theme=dark] .sigimg{filter:invert(1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Lato,sans-serif}
body{padding-bottom:calc(var(--bar) + 24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:14px;margin:0;flex:1}
header small{display:block;font-weight:400;color:rgba(255,255,255,.8);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1{min-width:0;white-space:normal}
.hp{display:inline-block;font-size:9px;font-weight:700;line-height:13px;padding:0 6px;margin-left:6px;border-radius:999px;border:1px solid rgba(255,255,255,.55);vertical-align:2px;letter-spacing:.2px;color:#fff}.hp.on{background:#2E9E6B;border-color:#2E9E6B}
@media (max-width:350px){.hp{padding:0 4px;margin-left:4px;font-size:8px}header h1{font-size:13px}}
header small.rec,header small.who{white-space:normal}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid #fff}
.iconbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;height:38px;min-width:36px;font-size:16px;padding:0 7px;position:relative;display:inline-flex;align-items:center;justify-content:center}
header{gap:7px!important}
#bellc{position:absolute;right:-3px;top:-4px;min-width:17px;height:17px;border-radius:9px;background:#E5483B;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--brand)}
#bellc[hidden]{display:none}
main{padding:14px 16px;max-width:640px;margin:0 auto}
@media (max-height:700px){#lgc{padding:10px}#lgc h2{margin:0 0 4px;font-size:15px}#lgc .f{margin-bottom:5px}#lgc input{height:36px!important}#lgc button.btn{height:36px!important}#lgc .muted{font-size:12px}#lgc details{margin-top:4px!important}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:14px}
.card h2{font-size:14px;font-weight:600;margin:0 0 10px}
b,strong{font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:10px 14px}
.tile.wide{grid-column:1/-1;background:var(--brand);color:#fff}
.tile .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tile.wide .l{color:#cfe3ec}
.tile .v{font-size:16px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bub{background:var(--surface);border:2px solid transparent;border-radius:16px;box-shadow:var(--sh);padding:10px 12px;text-align:left;font:inherit;color:inherit;min-height:84px;position:relative;display:block;width:100%}
.bub .n{font-weight:600;display:block;line-height:1.2}
.bub .p{font-size:14px;font-weight:600;color:var(--link)}
.bub .s{font-size:11px;color:var(--muted)}
.bub .pill{position:absolute;right:8px;top:8px}
.niqty{margin:6px 0 4px}.niqty .stepper{display:inline-flex;gap:0;height:32px;border-radius:16px;background:var(--soft);border:1px solid var(--secb);overflow:hidden;flex:none;align-items:center}.niqty .stepper button{width:32px;height:32px;border:0;border-radius:0;background:none;color:var(--brand);font-size:18px;padding:0}.niqty .stepper .stepin{width:42px;height:32px;border:0;border-left:1px solid var(--secb);border-right:1px solid var(--secb);border-radius:0;font-size:15px;font-weight:700;padding:0 2px;background:var(--surface)}
.icorow{display:flex;gap:6px;margin-top:8px}.icorow button{flex:1;max-width:46px;height:42px;border-radius:12px;border:2px solid var(--secb);background:var(--surface);font-size:22px;padding:0;line-height:1}.icorow button.on{border-color:var(--brand);background:var(--soft)}
.brows{padding:2px 14px;margin-top:0}.bsechead{display:flex;align-items:center;gap:8px;padding:10px 0 6px;border-bottom:2px solid var(--line)}.bsechead>span:first-child{font-size:18px}.bsechead b{font-size:15px}.bsechead .muted{font-size:12px}.bub.brow{display:flex;align-items:center;gap:10px;width:100%;min-height:0;padding:11px 0;background:none;border:0;border-radius:0;box-shadow:none}.bub.brow+.bub.brow{border-top:1px solid var(--line)}.bub.brow .n{font-size:15px}.bub.brow .s{display:block;font-size:12.5px;margin-top:2px}.bub.brow .s b{font-size:14px;font-weight:700;color:var(--link)}.bub.brow .s b.z{color:var(--exp)}.bub.brow .s .sf{display:inline-block;min-width:7.4em}   /* room for three digits, so every storage box lines up in one column */.bub.brow .pr{font-size:17px;color:var(--brand)}.bub.brow .ch{color:var(--muted)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{background:var(--surface);border:0;border-left:5px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:9px 10px 9px 12px;text-align:left;font:inherit;color:inherit;display:block;width:100%;position:relative}
.cc.done{border-left-color:var(--cnt);background:linear-gradient(90deg,var(--cnt-bg),var(--surface) 70%)}.cc.low{border-left-color:var(--soon)}.cc.out{border-left-color:var(--exp)}
.cc .cn{font-size:12px;font-weight:700;line-height:1.2;padding-right:2px}
.cc .cv{font-size:15px;font-weight:500;line-height:1.15;color:var(--ink);margin-top:2px}.cc.out .cv{color:var(--exp)}
.cc .cs{font-size:11px;color:var(--muted);margin-top:1px}
.cc .ck{position:absolute;right:10px;top:8px;font-size:12px;font-weight:700;color:var(--cnt)}
.cprog{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:8px}.cprog>div{height:100%;background:var(--cnt);border-radius:6px}
.pill{display:inline-block;font-size:12px;font-weight:600;color:var(--ok)}
.pill.low{color:var(--soon)}.pill.out{color:var(--exp)}
button.btn{border:0;border-radius:12px;height:42px;padding:0 18px;font:inherit;font-weight:600;background:var(--brand);color:var(--brand-ink)}
button.btn.sec{background:var(--surface);color:var(--link);border:2px solid var(--secb);box-shadow:0 1px 3px rgba(16,24,40,.12)}button.btn.red{background:var(--exp);color:#fff}button.btn.amber{background:var(--soon);color:#fff}button.btn.green{background:var(--ok)}
button.btn.sm{height:34px;padding:0 12px;font-size:12px}
button.btn.block{width:100%}
button:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.grow{flex:1}
.row.f{align-items:flex-end}   /* side-by-side fields line up on the bottom edge even when one label wraps to two lines */
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:23px;font-weight:600;line-height:1}
.stepper .stepin{width:74px;height:46px;text-align:center;font-size:16px;font-weight:600;padding:0 4px}
.selbtn{display:flex;align-items:center;justify-content:space-between;text-align:left;background:var(--field)!important;color:var(--ink)!important;border:2px solid var(--secb)!important;font-weight:600!important}
input,select{font:inherit;font-size:14px;height:42px;border:1px solid var(--ib);border-radius:10px;padding:0 10px;background:var(--field);color:var(--ink);width:100%}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 4px}
.f{margin-bottom:10px}
.list>div{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list>div[data-act]{cursor:pointer}
.list>div:first-child{border-top:0}
.muted{color:var(--muted);font-size:11px}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 3px}th:first-child,td:first-child{text-align:left}
td{padding:7px 3px;border-top:1px solid var(--line);text-align:right;vertical-align:middle}
tr.tot td{font-weight:600}
nav{z-index:30!important;position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:6}
nav button{border:0;background:none;font:inherit;font-size:10px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:18px}
nav button.on{color:var(--link);background:var(--soft)}
.sum>div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.sum>div:first-child,.sum>h2+div{border-top:0}
.sum .t{font-weight:600;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(var(--navoff,var(--bar)) + 12px);transform:translateX(-50%);background:var(--toast);color:#fff;padding:7px 8px 9px 14px;border-radius:999px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:94%;display:flex;gap:10px;align-items:center;font-size:12px;overflow:hidden}
#toast .tline{position:absolute;left:0;bottom:0;height:3px;background:#6FC3E8;width:100%;transform-origin:left;animation:tl 3s linear forwards}
@keyframes tl{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#toast.show{opacity:1;pointer-events:auto}
#toast button{border:0;background:#fff;color:#0E1B24;font:inherit;font-weight:800;font-size:12px;border-radius:999px;height:28px;padding:0 12px}
.modal{position:fixed;inset:0;background:var(--ov);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--pop);box-shadow:0 -6px 24px rgba(0,0,0,.35);border-top:1px solid var(--line);width:100%;max-width:640px;max-height:calc(100vh - var(--bar) - 24px - env(safe-area-inset-bottom));overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px 20px;margin-bottom:calc(var(--bar) + env(safe-area-inset-bottom))}
.modal.mid{align-items:center;padding:16px;z-index:40}.modal.mid>div{border-radius:18px;max-height:88vh;margin-bottom:0;border:1px solid var(--line);box-shadow:0 10px 36px rgba(0,0,0,.5)}
.modal h2{margin:0 0 10px;font-size:14px;font-weight:600}
.modal:not(.top):not(.mid)>div::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:#B5C0C8;margin:-4px auto 10px}   /* the pull bar is drawn by the sheet itself, so every pop-up has it even when its content is redrawn */
.modal>div{transition:transform .18s ease}.modal>div.pulling{transition:none}
.seg{display:grid;gap:8px}
.seg button{border:2px solid var(--secb);border-radius:10px;min-height:44px;background:var(--field);color:var(--ink);font:inherit;font-weight:600;padding:0 6px}
.seg button.on{border-color:var(--link);background:var(--link);color:var(--surface)}.seg button.on::before{content:"✓ "}
.pal{display:flex;flex-wrap:wrap;gap:8px}.pal button{width:34px;height:34px;border-radius:50%;border:2px solid var(--secb);padding:0}.pal button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chips button{flex:none;border:2px solid var(--secb);border-radius:18px;height:34px;padding:0 12px;background:var(--field);color:var(--ink);font:inherit;font-size:12px;font-weight:600}
.chips button.on{border-color:var(--brand);background:var(--soft)}
.ros{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 10px;font-size:13px;align-items:center}
.sw{display:inline-block;padding:1px 9px;border-radius:8px;color:#fff;font-size:11px;font-weight:700}
.sw.None{background:var(--line);color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:600;margin-left:8px;color:var(--cnt)}
.tag.neg{color:var(--exp)}.tag.pos{color:var(--ok)}.tag.cr{color:var(--soon)}
.sec-h{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);padding:10px 0 2px;border:0!important}
.sigimg{max-width:100%;max-height:90px;display:block;margin:6px 0}
.sigcard{border:2px dashed var(--line);border-radius:14px;padding:10px;background:var(--field)}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--ib);border-radius:10px;padding:8px;background:var(--field);color:var(--ink)}
.cancelbar{background:var(--exp-bg);color:var(--exp);font-weight:700;border-radius:12px;padding:8px 12px;margin-bottom:10px}
#pad{position:fixed;inset:0;background:var(--surface);z-index:80;overflow:hidden;touch-action:none}
#pad .prot{position:absolute;left:0;top:0;transform-origin:top left}
#pad canvas{position:absolute;left:0;top:0;touch-action:none}
#pad .plb{position:absolute;left:36px;top:30px;font-size:13px;font-weight:700;color:var(--muted);max-width:50%}
#pad .pbts{position:absolute;right:20px;top:16px;display:flex;gap:12px}
#pad .pbts button{width:110px;height:46px;border-radius:14px;border:1.5px solid var(--line);color:var(--link);font:inherit;font-weight:800;font-size:15px;background:var(--surface)}
#pad .pbts button.d{background:var(--brand);color:#fff;border-color:var(--brand)}
#pad .phint{position:absolute;left:0;right:0;top:50%;margin-top:-10px;text-align:center;color:#9AA7B3;font-size:18px;font-weight:600;pointer-events:none}
#pad .pline{position:absolute;left:36px;right:36px;bottom:50px;border-top:2px solid var(--line);pointer-events:none}
.pl>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.pl>div:first-child,.pl>h2+div{border-top:0}.pl .big{font-size:14px;font-weight:600}.pl .sub{padding-left:14px;color:var(--muted);font-size:13px}
.bar{height:10px;border-radius:5px;background:var(--ok)}.bar.neg{background:var(--exp)}.good{color:var(--ok)}.bad{color:var(--exp)}
.modal.top{align-items:flex-start}.modal.top>div{margin-bottom:0;border-radius:0 0 18px 18px;max-height:calc(var(--vvh,100vh) - var(--navoff,68px));padding-top:calc(10px + env(safe-area-inset-top))}
html:has(#mbg.top),body:has(#mbg.top){overflow:hidden;overscroll-behavior:none}html:has(#mbg),body:has(#mbg),html:has(#cf),body:has(#cf){overscroll-behavior:none}   /* no pull-to-refresh while a pop-up is open */.modal.top>div,.modal.top .list{overscroll-behavior:contain}   /* a search pop-up never lets the page behind it scroll */
.modal.top>div:has(>.sq+.list){display:flex;flex-direction:column;overflow:hidden}.modal.top>div:has(>.sq+.list)>.list{flex:1;min-height:0;overflow:auto}   /* search pop-ups: title and search stay put, only the list scrolls, Cancel stays at the bottom */
.sq{position:sticky;top:-10px;z-index:3;background:var(--pop);padding:6px 0 8px;margin:-6px 0 0}
.stick{position:sticky;top:var(--hh,60px);z-index:4;background:var(--bg);padding:6px 0 10px;margin:-6px 0 0}
input:disabled{background:var(--dis);color:var(--muted)}
.dd{position:relative}.dd>select{position:absolute;left:0;top:0;width:100%;height:46px;opacity:0;pointer-events:none}.ddb{width:100%;height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border:1px solid var(--ib);border-radius:10px;background:var(--field);color:var(--ink);font:inherit;font-size:15px;text-align:left}.ddb.open{border-color:var(--brand);box-shadow:0 0 0 2px var(--soft)}
#ddl{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--ib);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);overflow-y:auto}#ddl div{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;font-size:15px;color:var(--ink);border-top:1px solid var(--line)}#ddl div:first-child{border-top:0}#ddl div.cur{background:var(--soft);font-weight:700}
#spage .lockbox,.lockbox{display:flex;align-items:center;justify-content:space-between;min-height:34px;padding:0 10px;border-radius:10px;background:var(--soft);border:1px solid var(--line);box-shadow:inset 0 2px 5px rgba(0,0,0,.18);color:var(--ink);font-weight:600;font-size:14px}.lockbox .muted{font-weight:500;font-size:12px}
.bf{margin:0;overflow-anchor:none}.bf>.card,.bf>.card.bline{padding:0;overflow:hidden;margin:10px 0}.bhd{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font-weight:700;font-size:13px;letter-spacing:.03em;color:#fff}.bhd .bn{display:inline-block;width:24px;height:24px;border-radius:50%;background:#fff;color:#1d3d57;text-align:center;line-height:24px;font-size:13px;margin-right:8px}
.bhd.it,.bhd.who{background:var(--brand)}.bhd.bill{background:var(--ok)}.bhd.pay{background:#8a6410}.bhd.rcp{background:var(--muted)}.bhd.red{background:var(--exp)}.bhd[data-act]{cursor:pointer}.bok{background:#e1f3e4;color:#2e7d32;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px;letter-spacing:0}
